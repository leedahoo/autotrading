name: Build KOSPI basket shares

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kospi-share.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas pyarrow requests
      - name: Download and calculate
        run: |
          python - <<'PY'
          import requests
          import pandas as pd
          from pathlib import Path

          url = 'https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-2026.parquet'
          p = Path('/tmp/marcap-2026.parquet')
          r = requests.get(url, timeout=120)
          r.raise_for_status()
          p.write_bytes(r.content)

          df = pd.read_parquet(p)
          df['Date'] = pd.to_datetime(df['Date'])
          df['Code'] = df['Code'].astype(str).str.zfill(6)
          july = df[(df['Date'] >= '2026-07-01') & (df['Date'] <= '2026-07-31') & (df['Market'] == 'KOSPI')].copy()

          baskets = {
              'semiconductor': ['005930', '000660'],
              'financial': ['105560', '055550', '086790', '032830', '316140', '024110'],
              'consumer': ['033780', '015760', '278470', '003230', '090430'],
          }

          total = july.groupby('Date')['Marcap'].sum().rename('kospi_total_marcap')
          out = total.to_frame()
          for name, codes in baskets.items():
              cap = july[july['Code'].isin(codes)].groupby('Date')['Marcap'].sum()
              out[f'{name}_marcap'] = cap
              out[f'{name}_share_pct'] = cap / total * 100

          out['ex_semiconductor_share_pct'] = 100 - out['semiconductor_share_pct']
          out = out.reset_index().sort_values('Date')

          Path('analysis_output').mkdir(exist_ok=True)
          out.to_csv('analysis_output/kospi_basket_shares_2026-07.csv', index=False)

          names = july[july['Code'].isin(sum(baskets.values(), []))][['Code','Name']].drop_duplicates().sort_values('Code')
          names.to_csv('analysis_output/basket_constituents.csv', index=False)
          print(out.to_string(index=False))
          PY
      - name: Commit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_output
          git commit -m 'Add July 2026 KOSPI basket share data [skip ci]'
          git push
