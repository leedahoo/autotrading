name: Temporary sector rotation dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sector-rotation-2026.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas pyarrow requests lxml html5lib beautifulsoup4
      - name: Build June-August dataset
        run: |
          python - <<'PY'
          from io import StringIO
          from pathlib import Path
          import json
          import time
          import requests
          import pandas as pd

          START_DT = pd.Timestamp('2026-06-01')
          END_DT = pd.Timestamp('2026-08-04')
          baskets = {
              '반도체': ['005930', '000660'],
              '금융': ['105560', '055550', '086790', '032830', '316140', '024110'],
              '생활소비재': ['033780', '015760', '278470', '003230', '090430'],
          }
          all_codes = sum(baskets.values(), [])
          output = Path('analysis_output')
          output.mkdir(exist_ok=True)

          # KRX 전종목 일별 시가총액 공개 캐시
          marcap_url = 'https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-2026.parquet'
          p = Path('/tmp/marcap-2026.parquet')
          r = requests.get(marcap_url, timeout=180)
          r.raise_for_status()
          p.write_bytes(r.content)
          raw = pd.read_parquet(p)
          raw['Date'] = pd.to_datetime(raw['Date'])
          raw['Code'] = raw['Code'].astype(str).str.zfill(6)
          period = raw[(raw['Date'] >= START_DT) & (raw['Date'] <= END_DT) & (raw['Market'] == 'KOSPI')].copy()
          if period.empty:
              raise RuntimeError('No KOSPI market-cap data')
          total = period.groupby('Date')['Marcap'].sum().rename('KOSPI_Marcap')
          selected = period[period['Code'].isin(all_codes)][['Date','Code','Name','Close','Marcap','Stocks']].copy()

          # 네이버 증권의 KRX 기반 외국인·기관 일별 순매매량
          headers = {'User-Agent': 'Mozilla/5.0'}
          flow_frames = []
          diagnostics = []
          for code in all_codes:
              pages = []
              for page in range(1, 5):
                  url = f'https://finance.naver.com/item/frgn.naver?code={code}&page={page}'
                  resp = requests.get(url, headers=headers, timeout=30)
                  resp.raise_for_status()
                  resp.encoding = 'euc-kr'
                  tables = pd.read_html(StringIO(resp.text))
                  candidate = None
                  for t in tables:
                      flat = [' '.join(map(str, c)).strip() if isinstance(c, tuple) else str(c) for c in t.columns]
                      joined = ' '.join(flat)
                      if '날짜' in joined and '종가' in joined and '기관' in joined and '외국인' in joined:
                          candidate = t.copy()
                          candidate.columns = flat
                          break
                  if candidate is None:
                      diagnostics.append({'Code': code, 'Page': page, 'status': 'table_not_found'})
                      continue
                  # 위치 기준: 날짜, 종가, 전일비, 등락률, 거래량, 기관, 외국인, 보유주수, 보유율
                  if candidate.shape[1] < 7:
                      diagnostics.append({'Code': code, 'Page': page, 'status': 'too_few_columns', 'columns': list(candidate.columns)})
                      continue
                  candidate = candidate.iloc[:, :9].copy()
                  candidate.columns = ['Date','Naver_Close','Change','Change_Pct','Volume','Institution_Net_Volume','Foreign_Net_Volume','Foreign_Holdings','Foreign_Ratio'][:candidate.shape[1]]
                  pages.append(candidate)
                  diagnostics.append({'Code': code, 'Page': page, 'status': 'ok', 'rows': len(candidate)})
                  time.sleep(0.4)
              if not pages:
                  continue
              f = pd.concat(pages, ignore_index=True)
              f['Date'] = pd.to_datetime(f['Date'], errors='coerce')
              f = f.dropna(subset=['Date'])
              for col in ['Naver_Close','Institution_Net_Volume','Foreign_Net_Volume']:
                  f[col] = pd.to_numeric(f[col].astype(str).str.replace(',','', regex=False).str.replace('+','', regex=False), errors='coerce')
              f = f[(f['Date'] >= START_DT) & (f['Date'] <= END_DT)]
              f = f.drop_duplicates('Date').sort_values('Date')
              f['Code'] = code
              flow_frames.append(f[['Date','Code','Naver_Close','Institution_Net_Volume','Foreign_Net_Volume']])

          if not flow_frames:
              raise RuntimeError('No Naver investor-flow data')
          flows = pd.concat(flow_frames, ignore_index=True)
          daily_stock = selected.merge(flows, on=['Date','Code'], how='left')
          daily_stock['Institution_Net_Volume'] = daily_stock['Institution_Net_Volume'].fillna(0)
          daily_stock['Foreign_Net_Volume'] = daily_stock['Foreign_Net_Volume'].fillna(0)
          # 순매수 금액 근사치 = 일별 순매매량 × 종가
          daily_stock['Institution_Net_Est_Value'] = daily_stock['Institution_Net_Volume'] * daily_stock['Close']
          daily_stock['Foreign_Net_Est_Value'] = daily_stock['Foreign_Net_Volume'] * daily_stock['Close']
          code_to_basket = {code: basket for basket, codes in baskets.items() for code in codes}
          daily_stock['Basket'] = daily_stock['Code'].map(code_to_basket)
          daily_stock = daily_stock.merge(total.reset_index(), on='Date', how='left')
          daily_stock['KOSPI_Share_Pct'] = daily_stock['Marcap'] / daily_stock['KOSPI_Marcap'] * 100
          daily_stock = daily_stock.sort_values(['Date','Basket','Code'])
          daily_stock.to_csv(output / 'stock_daily_20260601_20260804.csv', index=False, encoding='utf-8-sig')

          basket_daily = daily_stock.groupby(['Date','Basket'], as_index=False).agg(
              Basket_Marcap=('Marcap','sum'),
              Foreign_Net_Est_Value=('Foreign_Net_Est_Value','sum'),
              Institution_Net_Est_Value=('Institution_Net_Est_Value','sum'),
              KOSPI_Marcap=('KOSPI_Marcap','first'),
          )
          basket_daily['KOSPI_Share_Pct'] = basket_daily['Basket_Marcap'] / basket_daily['KOSPI_Marcap'] * 100
          basket_daily.to_csv(output / 'basket_daily_20260601_20260804.csv', index=False, encoding='utf-8-sig')

          periods = [
              ('6월', pd.Timestamp('2026-06-01'), pd.Timestamp('2026-06-30')),
              ('7월', pd.Timestamp('2026-07-01'), pd.Timestamp('2026-07-31')),
              ('8월(1~4일)', pd.Timestamp('2026-08-01'), pd.Timestamp('2026-08-04')),
              ('전체(6/1~8/4)', pd.Timestamp('2026-06-01'), pd.Timestamp('2026-08-04')),
          ]
          summary_rows = []
          for label, fr, to in periods:
              block = basket_daily[(basket_daily['Date'] >= fr) & (basket_daily['Date'] <= to)]
              for basket, g in block.groupby('Basket'):
                  g = g.sort_values('Date')
                  first, last = g.iloc[0], g.iloc[-1]
                  summary_rows.append({
                      'Period': label,
                      'Basket': basket,
                      'Start_Date': first['Date'].date().isoformat(),
                      'End_Date': last['Date'].date().isoformat(),
                      'Start_Marcap': int(first['Basket_Marcap']),
                      'End_Marcap': int(last['Basket_Marcap']),
                      'Marcap_Change': int(last['Basket_Marcap'] - first['Basket_Marcap']),
                      'Marcap_Change_Pct': (last['Basket_Marcap'] / first['Basket_Marcap'] - 1) * 100,
                      'Foreign_Net_Est_Value_Sum': int(g['Foreign_Net_Est_Value'].sum()),
                      'Institution_Net_Est_Value_Sum': int(g['Institution_Net_Est_Value'].sum()),
                      'Start_KOSPI_Share_Pct': first['KOSPI_Share_Pct'],
                      'End_KOSPI_Share_Pct': last['KOSPI_Share_Pct'],
                      'KOSPI_Share_Change_Pp': last['KOSPI_Share_Pct'] - first['KOSPI_Share_Pct'],
                  })
          summary = pd.DataFrame(summary_rows)
          summary.to_csv(output / 'basket_period_summary_20260601_20260804.csv', index=False, encoding='utf-8-sig')

          stock_rows = []
          for label, fr, to in periods:
              block = daily_stock[(daily_stock['Date'] >= fr) & (daily_stock['Date'] <= to)]
              for (basket, code, name), g in block.groupby(['Basket','Code','Name']):
                  g = g.sort_values('Date')
                  first, last = g.iloc[0], g.iloc[-1]
                  stock_rows.append({
                      'Period': label, 'Basket': basket, 'Code': code, 'Name': name,
                      'Start_Date': first['Date'].date().isoformat(), 'End_Date': last['Date'].date().isoformat(),
                      'Start_Marcap': int(first['Marcap']), 'End_Marcap': int(last['Marcap']),
                      'Marcap_Change': int(last['Marcap'] - first['Marcap']),
                      'Marcap_Change_Pct': (last['Marcap'] / first['Marcap'] - 1) * 100,
                      'Foreign_Net_Est_Value_Sum': int(g['Foreign_Net_Est_Value'].sum()),
                      'Institution_Net_Est_Value_Sum': int(g['Institution_Net_Est_Value'].sum()),
                  })
          pd.DataFrame(stock_rows).to_csv(output / 'stock_period_summary_20260601_20260804.csv', index=False, encoding='utf-8-sig')

          metadata = {
              'period': '2026-06-01 through 2026-08-04',
              'market_cap_source': marcap_url,
              'flow_source': 'Naver Finance foreign/institution daily net trading volume; underlying domestic basic data marked as KRX-provided',
              'flow_value_method': 'estimated value = daily net volume multiplied by daily close',
              'last_market_cap_date': str(period['Date'].max().date()),
              'diagnostics': diagnostics,
          }
          (output / 'metadata_20260601_20260804.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          print(summary.to_string(index=False))
          PY
      - name: Commit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_output
          git commit -m 'Add June-August 2026 sector rotation dataset [skip ci]'
          git push
