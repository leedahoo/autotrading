name: Temporary extended sector rotation dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sector-rotation-extended.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests lxml html5lib beautifulsoup4
      - name: Build through Aug 5
        run: |
          python - <<'PY'
          from io import StringIO
          from pathlib import Path
          import requests, time, json
          import pandas as pd

          start, end = pd.Timestamp('2026-06-01'), pd.Timestamp('2026-08-05')
          baskets = {
            '반도체':['005930','000660'],
            '금융':['105560','055550','086790','032830','316140','024110'],
            '생활소비재':['033780','015760','278470','003230','090430'],
          }
          codes=sum(baskets.values(),[])
          c2b={c:b for b,cs in baskets.items() for c in cs}
          out=Path('analysis_output'); out.mkdir(exist_ok=True)

          # Historical listed shares and names from KRX-derived marcap cache.
          u='https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-2026.parquet'
          p=Path('/tmp/marcap.parquet'); r=requests.get(u,timeout=180); r.raise_for_status(); p.write_bytes(r.content)
          m=pd.read_parquet(p); m['Date']=pd.to_datetime(m['Date']); m['Code']=m['Code'].astype(str).str.zfill(6)
          m=m[(m['Market']=='KOSPI') & m['Code'].isin(codes)].copy()
          hist=m[(m['Date']>=start)&(m['Date']<=end)][['Date','Code','Name','Stocks','Marcap','Close']]
          latest=(m.sort_values('Date').groupby('Code').tail(1)[['Code','Name','Stocks']]
                    .rename(columns={'Name':'Latest_Name','Stocks':'Latest_Stocks'}))

          # Naver Finance: KRX-provided daily investor net volumes and closes.
          frames=[]; hdr={'User-Agent':'Mozilla/5.0'}
          for code in codes:
            pages=[]
            for page in range(1,6):
              url=f'https://finance.naver.com/item/frgn.naver?code={code}&page={page}'
              rr=requests.get(url,headers=hdr,timeout=30); rr.raise_for_status(); rr.encoding='euc-kr'
              for t in pd.read_html(StringIO(rr.text)):
                cols=[' '.join(map(str,x)).strip() if isinstance(x,tuple) else str(x) for x in t.columns]
                if '날짜' in ' '.join(cols) and '종가' in ' '.join(cols) and '기관' in ' '.join(cols) and '외국인' in ' '.join(cols):
                  q=t.iloc[:,:9].copy(); q.columns=['Date','Naver_Close','Change','Change_Pct','Volume','Institution_Net_Volume','Foreign_Net_Volume','Foreign_Holdings','Foreign_Ratio'][:q.shape[1]]
                  pages.append(q); break
              time.sleep(.25)
            f=pd.concat(pages,ignore_index=True); f['Date']=pd.to_datetime(f['Date'],errors='coerce'); f=f.dropna(subset=['Date'])
            for col in ['Naver_Close','Institution_Net_Volume','Foreign_Net_Volume']:
              f[col]=pd.to_numeric(f[col].astype(str).str.replace(',','',regex=False).str.replace('+','',regex=False),errors='coerce')
            f=f[(f['Date']>=start)&(f['Date']<=end)].drop_duplicates('Date')
            f['Code']=code; frames.append(f[['Date','Code','Naver_Close','Institution_Net_Volume','Foreign_Net_Volume']])
          flow=pd.concat(frames,ignore_index=True)

          d=flow.merge(hist,on=['Date','Code'],how='left').merge(latest,on='Code',how='left')
          d['Name']=d['Name'].fillna(d['Latest_Name']); d['Stocks']=d['Stocks'].fillna(d['Latest_Stocks'])
          d['Close']=d['Close'].fillna(d['Naver_Close']); d['Marcap']=d['Marcap'].fillna(d['Close']*d['Stocks'])
          d['Basket']=d['Code'].map(c2b)
          d['Foreign_Net_Est_Value']=d['Foreign_Net_Volume']*d['Close']
          d['Institution_Net_Est_Value']=d['Institution_Net_Volume']*d['Close']
          d=d.sort_values(['Date','Basket','Code'])
          d.to_csv(out/'stock_daily_20260601_20260805.csv',index=False,encoding='utf-8-sig')

          bd=d.groupby(['Date','Basket'],as_index=False).agg(Basket_Marcap=('Marcap','sum'),Foreign_Net_Est_Value=('Foreign_Net_Est_Value','sum'),Institution_Net_Est_Value=('Institution_Net_Est_Value','sum'))
          bd.to_csv(out/'basket_daily_20260601_20260805.csv',index=False,encoding='utf-8-sig')
          periods=[('6월','2026-06-01','2026-06-30'),('7월','2026-07-01','2026-07-31'),('8월(1~5일)','2026-08-01','2026-08-05'),('전체(6/1~8/5)','2026-06-01','2026-08-05')]
          rows=[]
          for label,a,z in periods:
            x=bd[(bd.Date>=a)&(bd.Date<=z)]
            for basket,g in x.groupby('Basket'):
              g=g.sort_values('Date'); s,e=g.iloc[0],g.iloc[-1]
              rows.append(dict(Period=label,Basket=basket,Start_Date=s.Date.date(),End_Date=e.Date.date(),Start_Marcap=int(s.Basket_Marcap),End_Marcap=int(e.Basket_Marcap),Marcap_Change=int(e.Basket_Marcap-s.Basket_Marcap),Marcap_Change_Pct=(e.Basket_Marcap/s.Basket_Marcap-1)*100,Foreign_Net_Est_Value_Sum=int(g.Foreign_Net_Est_Value.sum()),Institution_Net_Est_Value_Sum=int(g.Institution_Net_Est_Value.sum())))
          sm=pd.DataFrame(rows); sm.to_csv(out/'basket_period_summary_20260601_20260805.csv',index=False,encoding='utf-8-sig')

          sr=[]
          for label,a,z in periods:
            x=d[(d.Date>=a)&(d.Date<=z)]
            for (basket,code,name),g in x.groupby(['Basket','Code','Name']):
              g=g.sort_values('Date'); s,e=g.iloc[0],g.iloc[-1]
              sr.append(dict(Period=label,Basket=basket,Code=code,Name=name,Start_Date=s.Date.date(),End_Date=e.Date.date(),Start_Marcap=int(s.Marcap),End_Marcap=int(e.Marcap),Marcap_Change=int(e.Marcap-s.Marcap),Marcap_Change_Pct=(e.Marcap/s.Marcap-1)*100,Foreign_Net_Est_Value_Sum=int(g.Foreign_Net_Est_Value.sum()),Institution_Net_Est_Value_Sum=int(g.Institution_Net_Est_Value.sum())))
          pd.DataFrame(sr).to_csv(out/'stock_period_summary_20260601_20260805.csv',index=False,encoding='utf-8-sig')
          (out/'metadata_20260601_20260805.json').write_text(json.dumps({'market_cap_source':u,'flow_source':'Naver Finance investor trend, KRX-provided','flow_value_method':'net shares x close; estimate','date_range':[str(d.Date.min().date()),str(d.Date.max().date())]},ensure_ascii=False,indent=2),encoding='utf-8')
          print(sm.to_string(index=False))
          PY
      - name: Commit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_output
          git commit -m 'Add extended June-August 2026 sector dataset [skip ci]'
          git push
